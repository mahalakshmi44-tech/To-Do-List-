<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskMaster — Modern To-Do List</title>
  <meta name="description" content="A modern, responsive To-Do List web application with local storage persistence, filtering, priorities, and inline editing.">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-wrapper">
    <!-- Header Area -->
    <header class="app-header">
      <div class="header-top">
        <div class="logo-area">
          <div class="logo-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 11l3 3L22 4"></path>
              <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
            </svg>
          </div>
          <div>
            <h1 class="app-title">TaskMaster</h1>
            <p class="app-subtitle">Stay organized, focused, and productive</p>
          </div>
        </div>
        
        <button id="theme-toggle" class="btn-icon" aria-label="Toggle dark/light theme" title="Toggle Theme">
          <!-- Sun Icon (shown in dark mode) -->
          <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <!-- Moon Icon (shown in light mode) -->
          <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>

      <!-- Overall Progress Card -->
      <div class="progress-card">
        <div class="progress-info">
          <span class="progress-label">Task Completion</span>
          <span id="progress-percent" class="progress-percent">0%</span>
        </div>
        <div class="progress-bar-container">
          <div id="progress-bar" class="progress-bar-fill" style="width: 0%;"></div>
        </div>
        <div class="progress-stats">
          <span id="progress-counts">0 of 0 completed</span>
          <span id="current-date" class="date-badge"></span>
        </div>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="app-main">
      <!-- Add Task Form -->
      <section class="card input-card">
        <form id="task-form" autocomplete="off">
          <div class="input-primary-row">
            <input 
              type="text" 
              id="task-title-input" 
              placeholder="What do you need to get done?" 
              maxlength="150"
              required
              aria-label="New task title"
            >
            <button type="submit" class="btn btn-primary" id="add-task-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
              <span>Add Task</span>
            </button>
          </div>

          <div class="input-details-row">
            <!-- Priority Selector -->
            <div class="input-detail-group">
              <label for="task-priority-select">Priority:</label>
              <select id="task-priority-select" aria-label="Task Priority">
                <option value="medium" selected>Medium Priority</option>
                <option value="high">High Priority</option>
                <option value="low">Low Priority</option>
              </select>
            </div>

            <!-- Due Date Picker -->
            <div class="input-detail-group">
              <label for="task-duedate-input">Due Date:</label>
              <input type="date" id="task-duedate-input" aria-label="Task Due Date">
            </div>
          </div>
        </form>
      </section>

      <!-- Filter, Search & Controls Section -->
      <section class="controls-section">
        <div class="search-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input 
            type="search" 
            id="search-input" 
            placeholder="Search tasks..." 
            aria-label="Search tasks"
          >
        </div>

        <div class="controls-toolbar">
          <!-- Filter Tabs -->
          <nav class="filter-tabs" aria-label="Task filters">
            <button type="button" class="filter-tab active" data-filter="all">
              All <span class="badge" id="count-all">0</span>
            </button>
            <button type="button" class="filter-tab" data-filter="active">
              Active <span class="badge" id="count-active">0</span>
            </button>
            <button type="button" class="filter-tab" data-filter="completed">
              Completed <span class="badge" id="count-completed">0</span>
            </button>
          </nav>

          <!-- Sort Select -->
          <div class="sort-wrapper">
            <label for="sort-select" class="sr-only">Sort Tasks</label>
            <select id="sort-select" aria-label="Sort Tasks">
              <option value="date-desc">Newest First</option>
              <option value="date-asc">Oldest First</option>
              <option value="priority-desc">Highest Priority</option>
              <option value="duedate-asc">Earliest Due Date</option>
            </select>
          </div>
        </div>
      </section>

      <!-- Task List Container -->
      <section class="task-list-section">
        <ul id="task-list" class="task-list" aria-live="polite">
          <!-- Dynamic task items injected via app.js -->
        </ul>

        <!-- Empty State Message -->
        <div id="empty-state" class="empty-state hidden">
          <div class="empty-icon">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="9" y1="9" x2="15" y2="9"></line>
              <line x1="9" y1="13" x2="15" y2="13"></line>
              <line x1="9" y1="17" x2="11" y2="17"></line>
            </svg>
          </div>
          <h3 id="empty-title">No tasks found</h3>
          <p id="empty-subtitle">Start by adding a new task above!</p>
        </div>
      </section>

      <!-- App Footer / Actions -->
      <footer class="app-footer">
        <div class="footer-left">
          <span id="items-left">0 active items left</span>
        </div>
        <div class="footer-actions">
          <button type="button" id="clear-completed-btn" class="btn btn-outline-danger" disabled>
            Clear Completed
          </button>
          <button type="button" id="reset-sample-btn" class="btn btn-ghost" title="Reset sample tasks">
            Reset Demo
          </button>
        </div>
      </footer>
    </main>
  </div>

  <!-- Notification Toast Container -->
  <div id="toast" class="toast" role="alert" aria-live="assertive"></div>

  <script src="app.js"></script>
</body>
</html>
